
services:
  postgres:
    image: postgres:16-alpine
    container_name: bharattools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bharattools
      POSTGRES_USER: bharattools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bharattools_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharattools -d bharattools"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bharattools-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bharattools
      DB_USERNAME: bharattools
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_HOURS: 12
      FRONTEND_ORIGIN: http://localhost:8081
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bharattools-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  bharattools_pgdata:
